[package]
name = "justice-desktop"
version = "0.1.0"
description = "Justice desktop shell — native window over the Justice web app."
authors = ["Justice"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Small, quiet binaries — this is a shell, not a workhorse.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
